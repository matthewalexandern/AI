name: Versioned native release
on:
  workflow_dispatch:
  push:
    tags: ['v0.1.0']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  native:
    needs: validate
    uses: ./.github/workflows/native.yml
  assemble:
    needs: [validate, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-payload-*
          path: native-payloads
          merge-multiple: true
      - name: Assemble all six verified native payloads
        run: python3 tools/package.py --payloads native-payloads --output release/v0.1.0
      - name: Verify published bytes
        run: cd release/v0.1.0 && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/v0.1.0/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-fabrics-v0.1.0
          path: release/v0.1.0/*
          if-no-files-found: error
      - name: Publish tested version
        if: github.ref == 'refs/tags/v0.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 release/v0.1.0/* --verify-tag --title 'Mini Fabrics v0.1.0' --generate-notes
