name: Native payloads and clean installation
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [mini-fabrics-v0.1.0]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16
    steps:
      - name: Install signed baseline build prerequisites
        run: dnf --enablerepo=crb install -y git gcc gcc-c++ libstdc++-static cmake make python3 binutils tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - run: python3 tools/native_payload.py --target ${{ matrix.target }} --output native-payloads --jobs 2
      - run: python3 tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Verify native RHEL9 CPU inference
        run: |
          home="$RUNNER_TEMP/mini-fabrics"
          mkdir -p "$home"
          env PATH=/usr/bin:/bin ./clean-installers/mini-fabrics-installer-${{ matrix.target }} --prefix "$home" --backend cpu --model qwen2.5-0.5b --non-interactive
          python3 tools/smoke.py --runtime "$home/bin/fabrics" --home "$home" --expect-backend cpu --report native-smoke-${{ matrix.target }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-${{ matrix.target }}
          path: |
            native-payloads/${{ matrix.target }}.*
            native-smoke-${{ matrix.target }}.json
          if-no-files-found: error
  linux-clean:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-payload-${{ matrix.target }}
          path: native-payloads
      - run: python3 tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Clean Ubuntu22.04 and RHEL9 images contain no Go, CMake or compiler
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          for distro in ubuntu alma; do
            if [ "$distro" = ubuntu ]; then
              image='ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401'
              prerequisites='apt-get update && apt-get install -y python3 ca-certificates'
            else
              image='almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16'
              prerequisites='dnf install -y python3 ca-certificates'
            fi
            mkdir -p "$RUNNER_TEMP/clean-$distro"
            docker run --rm -e NATIVE_TARGET -e PREREQUISITES="$prerequisites" -v "$PWD:/work:ro" -v "$RUNNER_TEMP/clean-$distro:/home" -w /work "$image" bash -lc '
              set -eu
              eval "$PREREQUISITES"
              ! command -v go
              ! command -v cmake
              ! command -v c++
              /work/clean-installers/mini-fabrics-installer-$NATIVE_TARGET --prefix /home/mini-fabrics --backend cpu --model qwen2.5-0.5b --non-interactive
              python3 tools/smoke.py --runtime /home/mini-fabrics/bin/fabrics --home /home/mini-fabrics --expect-backend cpu --report /home/evidence.json
            '
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-linux-${{ matrix.target }}
          path: ${{ runner.temp }}/clean-*/evidence.json
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-amd64
            backends: cpu,metal
          - runner: macos-15
            target: darwin-arm64
            backends: cpu,metal
          - runner: windows-2022
            target: windows-amd64
            backends: cpu
          - runner: windows-11-arm
            target: windows-arm64
            backends: cpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - if: runner.os == 'macOS'
        run: bash native/macos/test.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\hyperv\Test-Harness.ps1
      - name: Build on the actual target architecture
        run: python tools/native_payload.py --target ${{ matrix.target }} --backends ${{ matrix.backends }} --output native-payloads --jobs 2
      - run: python tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Native macOS compiler-free CPU smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python_path="$(command -v python)"
          home="$RUNNER_TEMP/mini-fabrics"
          env PATH=/usr/bin:/bin ./clean-installers/mini-fabrics-installer-${{ matrix.target }} --prefix "$home" --backend cpu --model qwen2.5-0.5b --non-interactive
          "$python_path" tools/smoke.py --runtime "$home/bin/fabrics" --home "$home" --expect-backend cpu --report native-smoke-${{ matrix.target }}.json
      - name: Native Windows compiler-free CPU smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          $homePath = Join-Path $env:RUNNER_TEMP 'mini-fabrics'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & ".\clean-installers\mini-fabrics-installer-${{ matrix.target }}.exe" --prefix $homePath --backend cpu --model qwen2.5-0.5b --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Native installer failed' }
          & $python tools/smoke.py --runtime "$homePath\bin\fabrics.exe" --home $homePath --expect-backend cpu --report native-smoke-${{ matrix.target }}.json
          if ($LASTEXITCODE -ne 0) { throw 'Native inference smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-${{ matrix.target }}
          path: |
            native-payloads/${{ matrix.target }}.*
            native-smoke-${{ matrix.target }}.json
          if-no-files-found: error
