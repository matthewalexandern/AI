name: Native payloads and clean installation
on:
  workflow_call:
    inputs:
      reuse_run_id:
        description: Successful native workflow run whose verified payloads should be reused
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Successful native workflow run whose verified payloads should be reused
        type: string
        default: ''
  push:
    branches: [mini-fabrics-v0.1.0]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  reuse:
    if: inputs.reuse_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and retrieve all original native payloads
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python3 tools/verify_native_reuse.py --repository "$GITHUB_REPOSITORY" --run-id "$REUSE_RUN_ID" --output reuse-output --report native-reuse-report.json
      - name: Retain verified linux-amd64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-linux-amd64
          path: |
            reuse-output/native-payload-linux-amd64/native-payloads/linux-amd64.*
            reuse-output/native-payload-linux-amd64/native-smoke-linux-amd64.json
          if-no-files-found: error
      - name: Retain verified linux-arm64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-linux-arm64
          path: |
            reuse-output/native-payload-linux-arm64/native-payloads/linux-arm64.*
            reuse-output/native-payload-linux-arm64/native-smoke-linux-arm64.json
          if-no-files-found: error
      - name: Retain verified darwin-amd64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-darwin-amd64
          path: |
            reuse-output/native-payload-darwin-amd64/native-payloads/darwin-amd64.*
            reuse-output/native-payload-darwin-amd64/native-smoke-darwin-amd64.json
          if-no-files-found: error
      - name: Retain verified darwin-arm64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-darwin-arm64
          path: |
            reuse-output/native-payload-darwin-arm64/native-payloads/darwin-arm64.*
            reuse-output/native-payload-darwin-arm64/native-smoke-darwin-arm64.json
          if-no-files-found: error
      - name: Retain verified windows-amd64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-windows-amd64
          path: |
            reuse-output/native-payload-windows-amd64/native-payloads/windows-amd64.*
            reuse-output/native-payload-windows-amd64/native-smoke-windows-amd64.json
          if-no-files-found: error
      - name: Retain verified windows-arm64 payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-windows-arm64
          path: |
            reuse-output/native-payload-windows-arm64/native-payloads/windows-arm64.*
            reuse-output/native-payload-windows-arm64/native-smoke-windows-arm64.json
          if-no-files-found: error
      - name: Retain original native-run verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reuse-report
          path: native-reuse-report.json
          if-no-files-found: error
  linux:
    if: inputs.reuse_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: almalinux:9.0@sha256:a95a7766fd056b35f72f7b7f7301bcd46e40a6eecd9017e9c41cb4bf22ecb28b
    steps:
      - name: Install signed, frozen Alma9.0 baseline build prerequisites
        run: |
          cat > /etc/yum.repos.d/mini-fabrics-baseline.repo <<'EOF'
          [fabrics-base]
          name=Frozen AlmaLinux 9.0 BaseOS
          baseurl=https://vault.almalinux.org/9.0/BaseOS/$basearch/os/
          enabled=0
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
          [fabrics-app]
          name=Frozen AlmaLinux 9.0 AppStream
          baseurl=https://vault.almalinux.org/9.0/AppStream/$basearch/os/
          enabled=0
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
          [fabrics-crb]
          name=Frozen AlmaLinux 9.0 CRB
          baseurl=https://vault.almalinux.org/9.0/CRB/$basearch/os/
          enabled=0
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-9
          EOF
          dnf --disablerepo='*' --enablerepo='fabrics-*' install -y git gcc gcc-c++ libstdc++-static cmake make python3 binutils tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - run: python3 tools/native_payload.py --target ${{ matrix.target }} --output native-payloads --jobs 2
      - run: python3 tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Verify native RHEL9 CPU inference
        run: |
          home="$RUNNER_TEMP/mini-fabrics"
          mkdir -p "$home"
          env PATH=/usr/bin:/bin ./clean-installers/mini-fabrics-installer-${{ matrix.target }} --prefix "$home" --backend cpu --model qwen2.5-1.5b --non-interactive
          python3 tools/smoke.py --runtime "$home/bin/fabrics" --home "$home" --expect-backend cpu --log-directory native-logs-${{ matrix.target }} --report native-smoke-${{ matrix.target }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-${{ matrix.target }}
          path: |
            native-payloads/${{ matrix.target }}.*
            native-smoke-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            native-smoke-${{ matrix.target }}.json
            native-logs-${{ matrix.target }}/**
          if-no-files-found: ignore
  linux-clean:
    needs: [linux, reuse]
    if: always() && ((needs.linux.result == 'success' && needs.reuse.result == 'skipped') || (needs.linux.result == 'skipped' && needs.reuse.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-payload-${{ matrix.target }}
          path: .
      - run: python3 tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Clean Ubuntu22.04 and RHEL9 images contain no Go, CMake or compiler
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          for distro in ubuntu alma; do
            if [ "$distro" = ubuntu ]; then
              image='ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401'
              prerequisites='apt-get update && apt-get install -y python3 ca-certificates'
            else
              image='almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16'
              prerequisites='dnf install -y python3 ca-certificates'
            fi
            mkdir -p "$RUNNER_TEMP/clean-$distro"
            docker run --rm -e NATIVE_TARGET -e PREREQUISITES="$prerequisites" -v "$PWD:/work:ro" -v "$RUNNER_TEMP/clean-$distro:/home" -w /work "$image" bash -lc '
              set -eu
              eval "$PREREQUISITES"
              for tool in go cmake c++; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "Clean installation image unexpectedly contains $tool" >&2
                  exit 1
                fi
              done
              /work/clean-installers/mini-fabrics-installer-$NATIVE_TARGET --prefix /home/mini-fabrics --backend cpu --model qwen2.5-1.5b --non-interactive
              python3 tools/smoke.py --runtime /home/mini-fabrics/bin/fabrics --home /home/mini-fabrics --expect-backend cpu --report /home/evidence.json
            '
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-linux-${{ matrix.target }}
          path: ${{ runner.temp }}/clean-*/evidence.json
          if-no-files-found: error
  desktop:
    if: inputs.reuse_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-amd64
            backends: cpu,metal
          - runner: macos-15
            target: darwin-arm64
            backends: cpu,metal
          - runner: windows-2022
            target: windows-amd64
            backends: cpu
          - runner: windows-11-arm
            target: windows-arm64
            backends: cpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - if: runner.os == 'macOS'
        run: bash native/macos/test.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\hyperv\Test-Harness.ps1
      - name: Build on the actual target architecture
        run: python tools/native_payload.py --target ${{ matrix.target }} --backends ${{ matrix.backends }} --output native-payloads --jobs 2
      - run: python tools/package.py --targets ${{ matrix.target }} --payloads native-payloads --output clean-installers
      - name: Native macOS compiler-free CPU smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python_path="$(command -v python)"
          home="$RUNNER_TEMP/mini-fabrics"
          env PATH=/usr/bin:/bin ./clean-installers/mini-fabrics-installer-${{ matrix.target }} --prefix "$home" --backend cpu --model qwen2.5-1.5b --non-interactive
          "$python_path" tools/smoke.py --runtime "$home/bin/fabrics" --home "$home" --expect-backend cpu --log-directory native-logs-${{ matrix.target }} --report native-smoke-${{ matrix.target }}.json
      - name: Native Windows compiler-free CPU smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          $homePath = Join-Path $env:RUNNER_TEMP 'mini-fabrics'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & ".\clean-installers\mini-fabrics-installer-${{ matrix.target }}.exe" --prefix $homePath --backend cpu --model qwen2.5-1.5b --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Native installer failed' }
          & $python tools/smoke.py --runtime "$homePath\bin\fabrics.exe" --home $homePath --expect-backend cpu --log-directory native-logs-${{ matrix.target }} --report native-smoke-${{ matrix.target }}.json
          if ($LASTEXITCODE -ne 0) { throw 'Native inference smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-payload-${{ matrix.target }}
          path: |
            native-payloads/${{ matrix.target }}.*
            native-smoke-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            native-smoke-${{ matrix.target }}.json
            native-logs-${{ matrix.target }}/**
          if-no-files-found: ignore
