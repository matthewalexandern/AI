name: Mini Fabrics tests
on:
  push:
    branches: ['**']
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: go vet ./...
      - run: python -m unittest discover -s tools -p "test_*.py"
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/hyperv -p 'test_*.py'
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\hyperv\Test-Harness.ps1
      - if: runner.os == 'macOS'
        run: bash native/macos/test.sh
  source-installer-development:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - run: python3 tools/package.py --source-installer --output development-installers
